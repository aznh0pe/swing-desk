<title>Swing Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a trading blotter. Sticky desk bar + tab strip, dense tables, order-ticket cards with a price ladder. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #eaeef3; --ink: #0f1720; --ink-2: #445063; --ink-3: #657084;
  --line: #d9dee6; --line-2: #c7ced9; --accent: #1d3c6e; --accent-ink: #ffffff; --accent-soft: #e3eaf6;
  --brass: #9a6412; --brass-soft: #f6ecd9;
  --series: #2a78d6; --series-soft: rgba(42,120,214,.12); --loss: #e34948; --loss-soft: rgba(227,73,72,.12);
  --good: #0a7d0a; --good-bg: #e3f3e3; --warn: #8a5a00; --warn-bg: #fbf0d6; --crit: #b42e2e; --crit-bg: #f9e3e3;
  --info: #23518f; --info-bg: #e4ecf8;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 5px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1c2430; --ink: #e8edf4; --ink-2: #b4becc; --ink-3: #8f9aab;
  --line: #29323f; --line-2: #36414f; --accent: #9dbcf5; --accent-ink: #0d1117; --accent-soft: #1f2c42;
  --brass: #e2a84c; --brass-soft: #33281a;
  --series: #3987e5; --series-soft: rgba(57,135,229,.18); --loss: #e66767; --loss-soft: rgba(230,103,103,.18);
  --good: #4cc24c; --good-bg: #16301a; --warn: #f0b545; --warn-bg: #33290f; --crit: #ef7777; --crit-bg: #3a1a1c;
  --info: #9dbcf5; --info-bg: #1a2638; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1c2430; --ink: #e8edf4; --ink-2: #b4becc; --ink-3: #8f9aab;
  --line: #29323f; --line-2: #36414f; --accent: #9dbcf5; --accent-ink: #0d1117; --accent-soft: #1f2c42;
  --brass: #e2a84c; --brass-soft: #33281a;
  --series: #3987e5; --series-soft: rgba(57,135,229,.18); --loss: #e66767; --loss-soft: rgba(230,103,103,.18);
  --good: #4cc24c; --good-bg: #16301a; --warn: #f0b545; --warn-bg: #33290f; --crit: #ef7777; --crit-bg: #3a1a1c;
  --info: #9dbcf5; --info-bg: #1a2638; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num, .mono, td.n, .tnum { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 82%; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.deskbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.deskbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 22px; font-weight: 800; font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; }
.brand .sub { color: var(--ink-3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; flex-direction: column; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-width: 0; }
.chip .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.chip .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.chip-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.chip-btn:hover { border-color: var(--ink-3); }
.chip-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; margin-top: 4px; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 12px 11px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--brass-soft); color: var(--brass); font-size: 11.5px; font-family: var(--f-mono); text-align: center; }

main.wrap { padding-block: 18px 60px; display: flex; flex-direction: column; gap: 18px; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.section-head .meta { color: var(--ink-3); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-tickets { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
@media (max-width: 860px) { .g-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) { .g-tickets { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
.kpi .s { color: var(--ink-3); font-size: 12px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.crit { color: var(--crit); background: var(--crit-bg); }
.pill.info { color: var(--info); background: var(--info-bg); }
.pill.neutral { color: var(--ink-2); background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
td .t { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.pos { color: var(--ink); } .neg { color: var(--ink); }
.sign-up::before { content: "▲ "; color: var(--series); font-size: 9px; }
.sign-dn::before { content: "▼ "; color: var(--loss); font-size: 9px; }

/* order tickets */
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.ticket.overcap { border-style: dashed; }
.t-head { display: flex; gap: 12px; padding: 12px 14px 10px; align-items: flex-start; border-bottom: 1px dashed var(--line-2); }
.stamp { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border: 2px solid var(--brass); color: var(--brass); background: var(--brass-soft); border-radius: 6px; font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 22px; line-height: 1; transform: rotate(-4deg); }
.stamp.a { border-color: var(--line-2); color: var(--ink-2); background: var(--surface-2); }
.stamp.tu { font-size: 13px; letter-spacing: .02em; text-align: center; line-height: 1.05; }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.grade-card .gc-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.grade-card .gc-head > div:nth-child(2) { flex: 1 1 200px; }
.grade-card .gc-head h3 { margin: 0; }
.grade-card .gc-head .pill { margin-left: auto; }
.gc-rows { display: grid; grid-template-columns: minmax(118px, max-content) minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; }
.gc-rows dt { color: var(--ink-2); font-weight: 600; }
.gc-rows dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { .gc-rows { grid-template-columns: minmax(0, 1fr); gap: 2px; } .gc-rows dd { margin-bottom: 8px; } }
.gchip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); margin-right: 5px; vertical-align: 1px; white-space: nowrap; }
.gchip.aplus { color: var(--brass); border-color: var(--brass); background: var(--brass-soft); }
.gchip.topup { color: var(--ink-2); background: var(--surface-2); }
.cond-tbl td.c { text-align: center; white-space: nowrap; }
.cond-tbl td.c .w { font-weight: 700; }
.cond-tbl td.c.good .w { color: var(--good); } .cond-tbl td.c.warn .w { color: var(--warn); } .cond-tbl td.c.crit .w { color: var(--crit); }
.cond-tbl th.today, .cond-tbl td.today { background: var(--surface-2); }
.cond-tbl tr.grade-row td { font-weight: 600; }
.t-title { min-width: 0; flex: 1; }
.t-title .tk { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 24px; letter-spacing: .02em; line-height: 1.05; }
.t-title .nm { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-title .st { margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.t-odds { text-align: right; flex: none; }
.t-odds .big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
.t-odds .lbl { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.t-body { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 14px; }
.ladder { width: 34px; height: 116px; }
.levels { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; }
.levels .lk { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.levels .lv { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.levels .ld { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); text-align: right; }
.t-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.t-facts > div { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-facts > div:last-child { border-right: 0; }
.t-facts .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.t-facts .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.t-notes { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.t-notes b { color: var(--ink); font-weight: 600; }
.t-notes ul { margin: 0; padding-left: 18px; }
.t-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); align-items: center; }
.note-strip { padding: 7px 14px; font-size: 12.5px; border-top: 1px solid var(--line); background: var(--warn-bg); color: var(--warn); }

/* action alerts */
.act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-2); border-radius: var(--r); padding: 11px 13px; }
.act.alert { border-left-color: var(--crit); } .act.good { border-left-color: var(--good); } .act.info { border-left-color: var(--info); }
.act .tk { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 19px; }
.act .what { font-weight: 600; }
.act .why { color: var(--ink-2); font-size: 13px; }
.act .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 600px) { .act { grid-template-columns: minmax(0, 1fr); } .act .btns { justify-content: flex-start; } }

/* open positions + record a sale */
.g-pos { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
@media (max-width: 420px) { .g-pos { grid-template-columns: minmax(0, 1fr); } }
.pos-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.pc-head { display: flex; gap: 12px; padding: 12px 14px 10px; align-items: flex-start; border-bottom: 1px dashed var(--line-2); }
.pc-title { min-width: 0; flex: 1; }
.pc-title .tk { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 24px; letter-spacing: .02em; line-height: 1.05; }
.pc-title .nm { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-title .st { margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.pc-pnl { text-align: right; flex: none; }
.pc-pnl .big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; }
.pc-pnl .lbl { font-size: 11.5px; color: var(--ink-3); }
.pc-levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.pc-levels > div { padding: 8px 10px; border-right: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pc-levels > div:last-child { border-right: 0; }
.pc-levels .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pc-levels .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }
.pc-levels .s { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-signals { padding: 9px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.pc-signals .sigline { max-width: none; min-width: 0; }
.pc-signals b { color: var(--ink); font-weight: 600; }
.pc-sell { padding: 11px 14px 12px; display: grid; gap: 9px; background: var(--surface-2); border-top: 1px solid var(--line); }
.pc-sell .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.pc-sell-h { font-size: 13px; color: var(--ink-2); } .pc-sell-h b { color: var(--ink); }
.pc-quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; cursor: pointer; min-height: 30px; }
.chip:hover { border-color: var(--accent); }
.pc-foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pc-foot > span.small { color: var(--ink-2); }
.pc-warn { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 7px 10px; font-size: 12.5px; }
.pc-actions { display: flex; gap: 6px; padding: 8px 14px 10px; border-top: 1px solid var(--line); }
/* open P&L: green gain, red loss, grey breakeven (the sign stays in the text for colour-blind readers) */
.pnl-up { color: var(--good); } .pnl-dn { color: var(--crit); } .pnl-flat { color: var(--ink-2); }
/* what to do now, per position */
.pc-status { display: grid; gap: 3px; padding: 10px 14px 11px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--info-bg); }
.pc-status .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.pc-status .lbl { font-family: var(--f-display); font-weight: 800; font-stretch: 85%; letter-spacing: .03em; font-size: 16px; line-height: 1.2; color: var(--info); }
.pc-status .det { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.pc-status .note { font-size: 13px; font-weight: 600; color: var(--ink); }
.pc-status.st-sell { background: var(--crit-bg); border-left-color: var(--crit); } .pc-status.st-sell .lbl { color: var(--crit); }
.pc-status.st-good { background: var(--good-bg); border-left-color: var(--good); } .pc-status.st-good .lbl { color: var(--good); }
.pc-status.st-act { background: var(--warn-bg); border-left-color: var(--warn); } .pc-status.st-act .lbl { color: var(--warn); }
.nv { display: grid; gap: 6px; padding: 11px 14px 12px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--warn-bg); }
.nv.nv-avoid { border-left-color: var(--crit); background: var(--crit-bg); }
.nv-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.nv-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--warn); color: var(--warn-bg);
  font-family: var(--f-display); font-weight: 800; font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; line-height: 1.3; }
.nv-avoid .nv-badge { background: var(--crit); color: var(--crit-bg); }
.nv-badge svg { width: 13px; height: 13px; flex: none; }
.nv-src { font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }
.nv-main { display: flex; align-items: flex-start; gap: 7px; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ink); }
.nv-main svg { width: 17px; height: 17px; flex: none; margin-top: 1px; color: var(--good); }
.nv-avoid .nv-main svg { color: var(--crit); }
.nv-why { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.nv-why b { color: var(--ink-3); font-weight: 600; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; margin-right: 4px; }
.nv-do { font-size: 12.5px; color: var(--ink-3); }
.act .nv { margin: 7px 0 4px; padding: 9px 11px 10px; border: 0; border-left: 3px solid var(--warn); border-radius: var(--r-sm); }
.act .nv.nv-avoid { border-left-color: var(--crit); }
.act .nv-main { font-size: 14px; }
.pc-st-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 5px; }
.linklike { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--info); text-decoration: underline; cursor: pointer; }

function activity() {

function modal(title, body, submitLabel, onSubmit) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-back" id="mb"><form class="modal" id="mf" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}
    <div class="foot"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="submit">${esc(submitLabel)}</button></div></form></div>`;
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  document.addEventListener("keydown", onKey);
  $("#mCancel").onclick = close;
  $("#mb").addEventListener("click", (e) => { if (e.target.id === "mb") close(); });
  $("#mf").addEventListener("submit", async (e) => { e.preventDefault(); const btn = e.submitter || $("#mf button[type=submit]"); btn.disabled = true;
    try { await onSubmit(); close(); } catch (err) { console.error(err); btn.disabled = false; toast(writeErr(err)); } });
  setTimeout(() => $("#mf input")?.focus(), 30);
}
function writeErr(err) {
  const c = err?.code;
  if (c === "quota_exceeded") return "The dashboard's storage is full. Old scans need pruning; ask Claude to clean up history.";
  if (c === "invalid_argument") return "That change was refused. Check the numbers and try again.";
  if (c === "unavailable") return "Couldn't reach the database just now. Try again in a moment.";
  return "Couldn't save that change. " + (err?.message || "");
}
function need(v, label) { const n = Number(v); if (!Number.isFinite(n) || n <= 0) throw { code: "invalid_argument", message: `${label} must be a positive number.` }; return n; }
async function setDoc(path, data) { if (!S.db) throw { code: "unavailable", message: "Database not connected." }; await S.db.doc(path).set(data); }
async function updDoc(path, data) { if (!S.db) throw { code: "unavailable", message: "Database not connected." }; await S.db.doc(path).update(data); }

async function closeTrade(t, ex, date, reason, incPct, alertId, sold) {
  const entry = num(t.entry_price), held = num(t.shares);
  // part of an open position: the sold shares become their own closed trade (parent_id links them; every
  // statistic counts the position once) and the rest stays open with its stop, target and hold clock
  const partial = t.status === "open" && sold != null && sold > 0 && sold < held - 1e-9;
  const sh = partial ? +(+sold).toFixed(6) : held;
  const id = partial ? `${t.id}_s${Date.now().toString(36)}` : t.id;
  const pnl = +((ex - entry) * sh).toFixed(2); const pnlPct = +((100 * (ex - entry)) / entry).toFixed(3);
  const risk = num(t.stop) && entry > num(t.stop) ? (entry - num(t.stop)) : null;
  const daysHeld = tradingDaysBetween(t.entry_date, date) + (isTradingDay(t.entry_date) ? 1 : 0);
  const income = pnl > 0 ? +((pnl * incPct) / 100).toFixed(2) : 0;
  const fields = { status: "closed", exit_price: ex, exit_date: date, exit_reason: reason, pnl, pnl_pct: pnlPct, r_mult: risk ? +((ex - entry) / risk).toFixed(2) : null,
    days_held: daysHeld, income_pct: pnl > 0 ? incPct : 0, income_amount: income, closed_at: nowIso() };
  if (partial) {
    const { sold_shares, ...base } = t;
    await setDoc("trades/" + id, { ...base, id, shares: sh, parent_id: t.id, ...fields });
    try { await updDoc("trades/" + t.id, { shares: +(held - sh).toFixed(6), sold_shares: +((num(sold_shares) || 0) + sh).toFixed(6) }); }
    catch (err) { try { await S.db.doc("trades/" + id).delete(); } catch {} throw err; }
  } else {
    await updDoc("trades/" + t.id, fields);
  }
  await setDoc("ledger/pnl_" + id, { id: "pnl_" + id, type: "pnl", amount: pnl, date, ticker: t.ticker, trade_id: id, created_at: nowIso() });
  if (income > 0) await setDoc("ledger/inc_" + id, { id: "inc_" + id, type: "income", amount: -income, date, ticker: t.ticker, trade_id: id, pct: incPct, created_at: nowIso() });
  else if (S.ledger.some((l) => l.id === "inc_" + id)) await S.db.doc("ledger/inc_" + id).delete();
  const open = S.alerts.filter((a) => a.trade_id === t.id && a.status === "new" && a.type !== "entry");
  for (const a of open) if (!partial || a.id === alertId) await updDoc("alerts/" + a.id, { status: a.id === alertId ? "done" : "dismissed", done_at: nowIso() });
  toast(partial ? `Sold ${shareStr(sh)} of ${shareStr(held)} ${t.ticker} at ${px(ex)}: ${smoney(pnl)}. ${shareStr(held - sh)} share${held - sh === 1 ? "" : "s"} stay open.`
    : `${t.ticker} closed at ${px(ex)}: ${smoney(pnl)}${income ? `, ${money(income)} set aside as income` : ""}.`, 6000);
}

async function scanNow(opts = {}) {
  const st = settings();
  if (!S.mcp || !st.manual_trigger_id || !S.db || S.starting) return;
  const cur = currentRun();
  if (cur && cur.active) { toast("A scan is already running. Its progress is shown under the tabs."); return; }
  const token = "rt_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const retryOf = opts.retryOf || null;
  S.starting = token; runDismissed = null; renderChips();
  try {
    await S.db.doc("runs/" + token + "-s0").set({ token, seq: 0, state: "requested", pct: 4, step: retryOf ? "Starting the scan again" : "Starting the scan session", at: nowIso(), by: "page", kind: "manual", ...(retryOf ? { retry_of: retryOf } : {}) });
  } catch (e) { S.starting = null; renderChips(); toast(writeErr(e)); return; }
  noteMyRun(token, retryOf);
  try {
    await S.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: st.manual_trigger_id,
      text: `Run token: ${token}\n` + (retryOf ? `This is a retry: the scan started with run token ${retryOf} stopped before finishing, so finish this one end to end. ` : "") +
        `Manual scan requested from the dashboard at ${new Date().toISOString()}. Report progress with this token as the task describes.` });
    toast(retryOf ? "Scan started again. Follow its progress under the tabs." : "Scan started. Follow its progress under the tabs; alerts are also emailed to you.", 6000);
  } catch (e) {
    const c = e?.code, msg = fireErr(e);
    try { await S.db.doc("runs/" + token + "-s9").set({ token, seq: 9, state: "failed", step: "Couldn't start", message: msg, code: c || "error", at: nowIso(), by: "page" }); } catch {}
    toast(msg, 8000);
  } finally { S.starting = null; renderChips(); }
  // tidy up: progress records older than two days (this press is the user action that allows it)
  const cutoff = Date.now() - 2 * 86400000;
  for (const r of S.runs.filter((x) => (Date.parse(x.at) || 0) < cutoff).slice(0, 25)) { try { await S.db.doc("runs/" + r.id).delete(); } catch { break; } }
}

// a scheduled run that failed twice today (run + backup check): start it again from the Today's runs panel
async function runNow(key) {
  if (key !== "learning" && key !== "weekly") return scanNow();  // Scan now picks the right scan for the time of day
  const id = settings().schedule_ids?.[key];
  if (!S.mcp || !id) { toast("Open the dashboard in claude.ai to start it from here."); return; }
  try {

      text: `Started from the dashboard's Today's runs panel at ${new Date().toISOString()}: today's run and its backup check didn't save results.` });
    toast(`${key === "weekly" ? "Weekly recalibration" : "Daily learning review"} started; it takes ${key === "weekly" ? "about an hour" : "30 to 50 minutes"}.`, 7000);
  } catch (e) { toast(fireErr(e), 8000); }
}

// ---------------------------------------------------------------- phones: pin only the tab bar
// The full header is a third of a phone screen; on narrow screens it scrolls away and only the tabs
// (and the scan progress bar under them) stay pinned, so position cards get the room.
(() => {
  const bar = document.querySelector(".deskbar"), tabs = document.getElementById("tabs");
  if (!bar || !tabs) return;
  const mq = window.matchMedia ? matchMedia("(max-width: 720px)") : null;
  const pin = () => {
    const off = mq && mq.matches ? Math.max(0, Math.round(tabs.getBoundingClientRect().top - bar.getBoundingClientRect().top)) : 0;
    bar.style.top = off ? `calc(env(safe-area-inset-top, 0px) - ${off}px)` : "";
  };
  try { new ResizeObserver(pin).observe(bar); } catch {}
  try { mq.addEventListener("change", pin); } catch {}
  addEventListener("resize", pin); pin();
})();

  try {
    if (act === "fill" && a) fillModal(a);
    else if (act === "placed" && a) { await updDoc("alerts/" + a.id, { status: "placed", placed_at: nowIso() }); toast(`${a.ticker} marked as placed.`); }
    else if (act === "skip" && a) { await updDoc("alerts/" + a.id, { status: "skipped", skipped_at: nowIso() }); toast(`${a.ticker} skipped. The learning loop still grades it.`); }
    else if (act === "nofill" && a) { await updDoc("alerts/" + a.id, { status: "unfilled", unfilled_at: nowIso() }); toast(`${a.ticker}: recorded as placed but not filled. It counts toward your fill rate, not as a skip.`); }
    else if (act === "cancelled" && a) { await updDoc("alerts/" + a.id, { status: "cancelled", cancelled_at: nowIso() }); toast(`${a.ticker}: order recorded as cancelled.`); }
    else if (act === "copy" && a) copyOrder(a);
    else if (act === "dismiss" && a) { await updDoc("alerts/" + a.id, { status: "dismissed", done_at: nowIso() }); }
    else if (act === "gopos" && t) {
      const card = document.getElementById("pos-" + kid(t.id)); if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
      const inp = document.getElementById("sp-" + kid(t.id)); if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 350);
    }
    else if (act === "cardstop" && t) {
      const ns = num(btn.dataset.px); if (!ns) return;
      await updDoc("trades/" + t.id, { stop: ns });
      for (const x of S.alerts.filter((x) => x.trade_id === t.id && x.code === "RAISE_STOP" && x.status === "new")) await updDoc("alerts/" + x.id, { status: "done", done_at: nowIso() });
      toast(`${t.ticker} stop updated to ${px(ns)}.`);
    }
    else if (act === "applystop" && a) { const tr = tradeById(a.trade_id); if (tr && a.new_stop) await updDoc("trades/" + tr.id, { stop: num(a.new_stop) }); await updDoc("alerts/" + a.id, { status: "done", done_at: nowIso() }); toast(`${a.ticker} stop updated to ${px(a.new_stop)}.`); }
    else if (act === "exitdone" && a) { const tr = tradeById(a.trade_id); if (tr) closeModal(tr, { price: a.code === "TARGET_HIT" ? tr.target : a.code === "STOP_HIT" ? tr.stop : a.last, alertId: a.id,
      reason: { TARGET_HIT: "Target filled", GAP_ABOVE_TARGET: "Target filled", STOP_HIT: "Stop filled", GAP_BELOW_STOP: "Stop filled", EXIT_RULE: "Exit signal (sold at close)", TIME_STOP: "Time stop", EARNINGS: "Before earnings", TREND_BREAK: "Trend break" }[a.code] || "Manual" }); }
    else if (act === "close" && t) closeModal(t);
    else if (act === "sellfill") { const k = kid(btn.dataset.tid); const inp = $("#sp-" + k); if (inp) { inp.value = btn.dataset.px; const sel = $("#sr-" + k); if (sel && btn.dataset.why) sel.value = btn.dataset.why; sellPreview(inp.closest("form")); inp.focus({ preventScroll: true }); } }
    else if (act === "edit" && t) editModal(t);
    else if (act === "income" && t) await applyIncome(t);
    else if (act === "runnow") await runNow(btn.dataset.run);
  } catch (err) { console.error(err); toast(writeErr(err)); }
});
document.addEventListener("input", (e) => { const f = e.target.closest?.("form[data-sell]"); if (f) sellPreview(f); });
document.addEventListener("submit", async (e) => {
  if (e.target.matches?.("form[data-sell]")) { e.preventDefault();
    try { await submitSale(e.target); } catch (err) { console.error(err); toast(err?.code === "invalid_argument" && err.message ? err.message : writeErr(err), 6000); }
    return; }
  if (e.target.id === "fundsForm") { e.preventDefault();
    try { const amt = need($("#fAmt").value, "Amount"); const typ = $("#fType").value; const id = (typ === "deposit" ? "dep_" : "wd_") + Date.now().toString(36);
      await setDoc("ledger/" + id, { id, type: typ, amount: typ === "deposit" ? amt : -amt, date: $("#fDate").value || todayPT(), note: $("#fNote").value.slice(0, 120), created_at: nowIso() });
      toast(`${typ === "deposit" ? "Added" : "Removed"} ${money(amt)}.`); } catch (err) { toast(writeErr(err)); } }
  if (e.target.id === "setForm") { e.preventDefault();
    try { const s = { ...settings(), initial_balance: need($("#sInit").value, "Starting balance"), income_default_pct: Math.min(100, Math.max(0, Number($("#sInc").value) || 0)),
        max_open_positions: Math.max(1, Math.round(Number($("#sMax").value) || 5)), risk_pct: need($("#sRisk").value, "Risk per trade"), max_position_pct: need($("#sPos").value, "Max position"), updated_at: nowIso() };
      await setDoc("config/settings", s);
      const init = S.ledger.find((l) => l.type === "initial");
      if (init && num(init.amount) !== s.initial_balance) await updDoc("ledger/" + init.id, { amount: s.initial_balance });
      toast("Settings saved. The next scan uses them."); } catch (err) { toast(writeErr(err)); } }
});
$("#scanBtn").addEventListener("click", () => scanNow());

// ---------------------------------------------------------------- boot
try { const t = localStorage.getItem("tab"); if (t && TABS.some(([k]) => k === t)) S.tab = t; } catch {}
render();
const loadTimer = setTimeout(() => { if (!S.loaded.alerts) { S.dbError = "The dashboard database hasn't answered yet. Data may be out of date; it refreshes automatically."; render(); } }, 10000);
// live updates re-render the page, but never while you are typing in one of its forms
let rq = 0, pending = false, ptrDown = false;
const typing = () => { const el = document.activeElement; return !!el && $("#main").contains(el) && (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || !!el.closest("form[data-hold]")); };
const busy = () => typing() || ptrDown;
const rerender = () => { if (busy()) { pending = true; return; } cancelAnimationFrame(rq); rq = requestAnimationFrame(render); };
function flushRender() { setTimeout(() => { if (pending && !busy()) { pending = false; render(); } }, 0); }
document.addEventListener("focusout", flushRender);
// never swap the page out from under a tap: wait until the press (and its click) is over
document.addEventListener("pointerdown", () => { ptrDown = true; }, true);
const ptrUp = () => setTimeout(() => { ptrDown = false; flushRender(); }, 150);
document.addEventListener("pointerup", ptrUp, true); document.addEventListener("pointercancel", ptrUp, true);
(async () => {
  const [db, user, mcp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("mcp")]);
  S.db = db; S.user = user; S.mcp = mcp;
  if (!db) { clearTimeout(loadTimer); S.dbError = "This view can't reach the dashboard database. Open the dashboard in claude.ai while signed in."; render(); return; }
  const onErr = (name) => (err) => { console.error(name, err); if (err?.code !== "unavailable") { S.dbError = `Couldn't load ${name} (${err?.code}).`; rerender(); } };
  const list = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  db.doc("config/settings").onSnapshot((d) => { S.settings = d.exists ? d.data() : null; S.loaded.settings = true; rerender(); }, onErr("settings"));
  db.collection("alerts").orderBy("created_at", "desc").limit(400).onSnapshot((s) => { S.alertsRaw = list(s); mergeAlerts(); S.loaded.alerts = true; if (!s.metadata.fromCache) { clearTimeout(loadTimer); S.dbError = null; } rerender(); setTimeout(autoExpireOrders, 0); }, onErr("alerts"));
  db.collection("trades").onSnapshot((s) => { S.trades = list(s); S.loaded.trades = true; rerender(); }, onErr("trades"));
  db.collection("ledger").onSnapshot((s) => { S.ledger = list(s); S.loaded.ledger = true; rerender(); }, onErr("ledger"));
  db.collection("scans").orderBy("started_at", "desc").limit(60).onSnapshot((s) => { S.scans = list(s).sort((a, b) => (Date.parse(b.started_at) || 0) - (Date.parse(a.started_at) || 0)).slice(0, 40); mergeAlerts(); rerender(); setTimeout(autoExpireOrders, 0); }, onErr("scans"));
  db.collection("runs").orderBy("at", "desc").limit(60).onSnapshot((s) => { S.runs = list(s); noteRuns(); renderRunbar(); renderChips(); maybeAutoRetry(); }, onErr("scan progress"));
  setInterval(() => { maybeAutoRetry(); renderRunbar(); renderChips(); }, 30000);
  let healthSig = "";  // re-render when a run's status changes with the clock (due → running → late → backup)
  setInterval(() => { const sig = runHealth().items.map((i) => i.state).join(","); if (sig !== healthSig) { healthSig = sig; rerender(); } }, 60000);
  db.collection("research").limit(400).onSnapshot((s) => { S.research = list(s); rerender(); }, onErr("research"));
  db.collection("learning").limit(20).onSnapshot((s) => { S.learning = Object.fromEntries(list(s).map((d) => [d.id, d])); rerender(); }, onErr("learning record"));
  db.collection("research_results").orderBy("tested_at", "desc").limit(400).onSnapshot((s) => { S.results = list(s); rerender(); }, onErr("research results"));
  db.collection("journal").orderBy("date", "desc").limit(60).onSnapshot((s) => { S.journal = list(s); rerender(); }, onErr("journal"));
  db.doc("strategy/params").onSnapshot((d) => { S.params = d.exists ? d.data() : null; rerender(); }, onErr("strategy params"));
  db.doc("strategy/backtest").onSnapshot((d) => { S.backtest = d.exists ? d.data() : null; rerender(); }, onErr("backtest"));
})();
})();
</script>
