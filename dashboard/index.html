<title>Swing Desk</title>

<style>
/* Layout: a trading blotter. Sticky desk bar + tab strip, dense tables, order-ticket cards with a price ladder. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #eaeef3; --ink: #0f1720; --ink-2: #445063; --ink-3: #657084;
  --line: #d9dee6; --line-2: #c7ced9; --accent: #1d3c6e; --accent-ink: #ffffff; --accent-soft: #e3eaf6;
  --brass: #9a6412; --brass-soft: #f6ecd9;
  --series: #2a78d6; --series-soft: rgba(42,120,214,.12); --loss: #e34948; --loss-soft: rgba(227,73,72,.12);
  --good: #0a7d0a; --good-bg: #e3f3e3; --warn: #8a5a00; --warn-bg: #fbf0d6; --crit: #b42e2e; --crit-bg: #f9e3e3;
  --info: #23518f; --info-bg: #e4ecf8;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 5px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1c2430; --ink: #e8edf4; --ink-2: #b4becc; --ink-3: #8f9aab;
  --line: #29323f; --line-2: #36414f; --accent: #9dbcf5; --accent-ink: #0d1117; --accent-soft: #1f2c42;
  --brass: #e2a84c; --brass-soft: #33281a;
  --series: #3987e5; --series-soft: rgba(57,135,229,.18); --loss: #e66767; --loss-soft: rgba(230,103,103,.18);
  --good: #4cc24c; --good-bg: #16301a; --warn: #f0b545; --warn-bg: #33290f; --crit: #ef7777; --crit-bg: #3a1a1c;
  --info: #9dbcf5; --info-bg: #1a2638; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1c2430; --ink: #e8edf4; --ink-2: #b4becc; --ink-3: #8f9aab;
  --line: #29323f; --line-2: #36414f; --accent: #9dbcf5; --accent-ink: #0d1117; --accent-soft: #1f2c42;
  --brass: #e2a84c; --brass-soft: #33281a;
  --series: #3987e5; --series-soft: rgba(57,135,229,.18); --loss: #e66767; --loss-soft: rgba(230,103,103,.18);
  --good: #4cc24c; --good-bg: #16301a; --warn: #f0b545; --warn-bg: #33290f; --crit: #ef7777; --crit-bg: #3a1a1c;
  --info: #9dbcf5; --info-bg: #1a2638; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num, .mono, td.n, .tnum { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 82%; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.deskbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.deskbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 22px; font-weight: 800; font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; }
.brand .sub { color: var(--ink-3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; flex-direction: column; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-width: 0; }
.chip .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.chip .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.chip-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.chip-btn:hover { border-color: var(--ink-3); }
.chip-btn:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; margin-top: 4px; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 12px 11px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--brass-soft); color: var(--brass); font-size: 11.5px; font-family: var(--f-mono); text-align: center; }

main.wrap { padding-block: 18px 60px; display: flex; flex-direction: column; gap: 18px; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.section-head .meta { color: var(--ink-3); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-tickets { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
@media (max-width: 860px) { .g-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) { .g-tickets { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
.kpi .s { color: var(--ink-3); font-size: 12px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.crit { color: var(--crit); background: var(--crit-bg); }
.pill.info { color: var(--info); background: var(--info-bg); }
.pill.neutral { color: var(--ink-2); background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
td .t { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.pos { color: var(--ink); } .neg { color: var(--ink); }
.sign-up::before { content: "▲ "; color: var(--series); font-size: 9px; }
.sign-dn::before { content: "▼ "; color: var(--loss); font-size: 9px; }

/* order tickets */
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.ticket.overcap { border-style: dashed; }
.t-head { display: flex; gap: 12px; padding: 12px 14px 10px; align-items: flex-start; border-bottom: 1px dashed var(--line-2); }
.stamp { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border: 2px solid var(--brass); color: var(--brass); background: var(--brass-soft); border-radius: 6px; font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 22px; line-height: 1; transform: rotate(-4deg); }
.stamp.a { border-color: var(--line-2); color: var(--ink-2); background: var(--surface-2); }
.t-title { min-width: 0; flex: 1; }
.t-title .tk { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 24px; letter-spacing: .02em; line-height: 1.05; }
.t-title .nm { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-title .st { margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.t-odds { text-align: right; flex: none; }
.t-odds .big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
.t-odds .lbl { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.t-body { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 14px; }
.ladder { width: 34px; height: 116px; }
.levels { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; }
.levels .lk { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.levels .lv { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.levels .ld { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); text-align: right; }
.t-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.t-facts > div { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-facts > div:last-child { border-right: 0; }
.t-facts .k { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.t-facts .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.t-notes { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.t-notes b { color: var(--ink); font-weight: 600; }
.t-notes ul { margin: 0; padding-left: 18px; }
.t-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); align-items: center; }
.note-strip { padding: 7px 14px; font-size: 12.5px; border-top: 1px solid var(--line); background: var(--warn-bg); color: var(--warn); }

/* action alerts */
.act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-2); border-radius: var(--r); padding: 11px 13px; }
.act.alert { border-left-color: var(--crit); } .act.good { border-left-color: var(--good); } .act.info { border-left-color: var(--info); }
.act .tk { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 19px; }
.act .what { font-weight: 600; }
.act .why { color: var(--ink-2); font-size: 13px; }
.act .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 600px) { .act { grid-template-columns: minmax(0, 1fr); } .act .btns { justify-content: flex-start; } }

.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 18px; color: var(--ink-2); background: var(--surface); }
.empty b { color: var(--ink); }
.banner { border-radius: var(--r); padding: 10px 13px; font-size: 13px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--info); }
.banner.crit { background: var(--crit-bg); color: var(--crit); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--f-mono); font-size: 10.5px; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis line { stroke: var(--line-2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; z-index: 3; }
.tip .k { color: var(--ink-3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* forms + modal */
.form { display: grid; gap: 10px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
input[type=number], input[type=text], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 9px; width: 100%; min-width: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
textarea { font-family: var(--f-body); min-height: 60px; }
.modal-back { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; width: min(520px, 100%); max-height: 90vh; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
b.caution-word, .t-notes b.caution-word, .empty b.caution-word { color: var(--crit); font-weight: 800; }
.sigline { margin: 1px 0 5px; min-width: 170px; max-width: 255px; line-height: 1.35; white-space: normal; }
.sigline .small { color: var(--ink2); }
pre.digest { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: var(--r-sm); margin: 8px 0 0; overflow-x: auto; }
.strat { display: flex; flex-direction: column; gap: 8px; }
.strat .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 8px; }
.stats .k { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.stats .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.timeline { display: flex; flex-direction: column; }
.timeline .ev { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.timeline .ev:last-child { border-bottom: 0; }
@media (max-width: 600px) { .timeline .ev { grid-template-columns: minmax(0, 1fr) auto; } .timeline .ev .when { grid-column: 1 / -1; } }
.disclaimer { color: var(--ink-3); font-size: 12px; max-width: 75ch; }
/* scan-now progress */
.runbar { border-top: 1px solid var(--line); background: var(--surface); }
.runbar .wrap { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 6px; padding-block: 9px 10px; }
.rb-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rb-label { font-weight: 600; }
.rb-meta { color: var(--ink-3); font-size: 12.5px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.rb-row .sp { flex: 1; }
.rb-track { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.rb-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--series); border-radius: 999px; transition: width .6s ease; }
.runbar.done .rb-fill { background: var(--good); }
.runbar.failed .rb-fill { background: var(--crit); }
.runbar.active .rb-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: rbshine 1.6s linear infinite; }
@keyframes rbshine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.rb-steps { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-3); }
.rb-steps li::before { content: "○ "; }
.rb-steps li.ok { color: var(--ink-2); } .rb-steps li.ok::before { content: "● "; color: var(--good); }
.rb-steps li.now { color: var(--ink); font-weight: 600; } .rb-steps li.now::before { content: "◉ "; color: var(--series); }
@media (max-width: 600px) { .rb-steps { display: none; } .runbar .wrap { padding-block: 7px 8px; gap: 4px; } .rb-label { font-size: 13px; } }
/* strategy lab extras */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
.checks .ok { color: var(--good); font-weight: 700; } .checks .no { color: var(--crit); font-weight: 700; }
.checks .need { color: var(--ink-3); font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; }
.why-box { font-size: 12.5px; border-radius: var(--r-sm); padding: 7px 9px; background: var(--surface-2); color: var(--ink-2); }
.why-box.off { background: var(--warn-bg); color: var(--warn); }
.tag { display: inline-block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.g-research { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }
.idea { display: flex; flex-direction: column; gap: 7px; }
.idea .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.idea .rules { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.funnel { display: flex; flex-wrap: wrap; gap: 8px; }
.funnel .kpi { min-width: 110px; flex: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="deskbar">
  <div class="wrap">
    <div class="brand"><h1>Swing Desk</h1><span class="sub">A+ setups only</span></div>
    <div class="chips" id="chips"></div>
    <button class="btn primary" id="scanBtn" type="button" title="Run a market scan now">Scan now</button>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <div class="runbar" id="runbar" hidden aria-live="polite"></div>
</header>
<main class="wrap" id="main"></main>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- state

    if (now < addMin(bk, p.dur)) return { state: "retry", pill: "warn", text: "Re-running", note: `The ${to12(failed)} run failed; the ${backupLabel} backup check is running it again.` };

  if (now < addMin(at, p.dur)) return { state: "running", pill: "info", text: "Running", note: `Started ${to12(at)}; results usually arrive within ${p.dur} minutes.` };
  if (now < bk) return { state: "late", pill: "warn", text: "Not in yet", note: `If it doesn't arrive, the backup check at ${backupLabel} runs it.` };
  if (now < addMin(bk, p.dur)) return { state: "retry", pill: "warn", text: "Backup running", note: `It didn't arrive, so the ${backupLabel} backup check is running it now.` };

function drawMonthly() {
  const el = $("#moChart"); if (!el) return;
  const by = {}; for (const t of closedTrades()) { const k = monthKey(t.exit_date); by[k] = (by[k] || 0) + (num(t.pnl) || 0); }
  const keys = Object.keys(by).sort().slice(-12);
  if (!keys.length) { el.innerHTML = `<div class="empty small">Bars appear when the first trade closes.</div>`; return; }
  const W = 420, H = 220, L = 52, R = 8, T = 10, B = 26;
  const vals = keys.map((k) => by[k]); const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = (v) => T + (1 - (v - y0) / Math.max(1e-9, y1 - y0)) * (H - T - B);
  const bw = Math.min(28, (W - L - R) / keys.length - 6);
  const X = (i) => L + ((i + 0.5) * (W - L - R)) / keys.length;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly realized profit and loss">
    <g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
    ${ticks.map((t) => `<text x="${L - 8}" y="${Y(t) + 3.5}" text-anchor="end">${t < 0 ? "−" : ""}$${Math.abs(Math.round(t)).toLocaleString()}</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)"/>
    ${keys.map((k, i) => { const v = by[k], y = Y(Math.max(v, 0)), h = Math.max(1, Math.abs(Y(v) - Y(0)));
      return `<g class="bar" data-k="${k}" data-v="${v}"><rect x="${X(i) - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${v >= 0 ? "var(--series)" : "var(--loss)"}"/>
      <rect x="${X(i) - bw / 2 - 4}" y="${T}" width="${bw + 8}" height="${H - T - B}" fill="transparent"/>
      <text x="${X(i)}" y="${H - 6}" text-anchor="middle">${new Date(k + "-15T12:00:00").toLocaleDateString("en-US", { month: "short" })}</text></g>`; }).join("")}
  </svg><div class="tip" id="moTip" hidden></div>`;
  const tip = $("#moTip"), svg = el.querySelector("svg");
  el.querySelectorAll("g.bar").forEach((g) => {
    g.addEventListener("pointerenter", () => { const r = svg.getBoundingClientRect(); const k = g.dataset.k; tip.hidden = false;
      tip.innerHTML = `<span class="k">${new Date(k + "-15T12:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</span><br><b class="num">${smoney(g.dataset.v)}</b>`;
      const i = keys.indexOf(k); tip.style.left = Math.min(Math.max(0, (X(i) / W) * r.width - 50), r.width - 130) + "px"; tip.style.top = "0px"; });
    g.addEventListener("pointerleave", () => { tip.hidden = true; });
  });
}

// ---------------------------------------------------------------- alerts tab
function viewAlerts() {
  const st = settings(); const f = funds(); const today = todayPT();
  const actions = S.alerts.filter((a) => (a.type === "exit" || a.type === "adjust") && a.status === "new")
    .filter((a) => S.trades.some((t) => t.id === a.trade_id && t.status === "open"));
  const entries = S.alerts.filter(entryLive)
    .sort((a, b) => (b.valid_for || "").localeCompare(a.valid_for || "") || (num(b.score) || 0) - (num(a.score) || 0));
  const capLeft = Number(st.max_open_positions) - f.open.length;
  let html = `<section class="section"><div class="section-head"><h2>Action needed on open positions</h2><span class="meta">Exit early, raise a stop, or confirm a fill</span></div>`;
  html += actions.length ? `<div class="grid">${actions.map(actionCard).join("")}</div>` : `<div class="empty">No exit or stop alerts right now. The pre-close scan (12:25 PM PT) and post-close scan (2:05 PM PT) check every open position.</div>`;
  html += `</section><section class="section"><div class="section-head"><h2>New A+ opportunities</h2>
    <span class="meta">${capLeft > 0 ? `${capLeft} of ${esc(st.max_open_positions)} position slots free · ${money(f.cash)} cash` : `All ${esc(st.max_open_positions)} slots are in use; setups still listed so you can swap into a stronger one`}</span></div>`;
  const featured = entries.filter((a) => !a.also_qualified).sort((a, b) => (num(a.rank) ?? 99) - (num(b.rank) ?? 99) || (num(b.score) || 0) - (num(a.score) || 0));

    ${extra.map((a) => `<tr><td><span class="t">${esc(a.ticker)}</span></td><td class="small">${esc(a.strategy_label)}</td><td class="n">${esc(a.score)}</td><td class="n">${pct(a.win_pct, 0)}</td><td class="n">${px(a.entry)}</td><td class="n">${px(a.stop)}</td><td class="n">${px(a.target)}</td><td class="n">${esc(a.shares)}${a.fractional ? "*" : ""}</td><td class="n">${money(a.total_cost)}</td><td class="small muted">${esc(String(a.capacity_note || "").replace(/^Also qualified \(|\)\..*$/g, ""))}</td>
      <td class="n" style="white-space:nowrap"><button class="btn small" type="button" data-act="fill" data-id="${esc(a.id)}">Filled</button> <button class="btn ghost small" type="button" data-act="skip" data-id="${esc(a.id)}">Skip</button></td></tr>`).join("")}
    </tbody></table></div></details>`;
  html += `</section><section class="section"><div class="section-head"><h2>Open positions</h2><span class="meta">Filled orders being managed · hold days count trading sessions</span></div>${openTable()}</section>`;
  const recent = S.alerts.filter((a) => a.type === "entry" && !entryLive(a)).slice(0, 15);
  if (recent.length) html += `<section class="section"><details><summary>Recently handled setups (${recent.length})</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Signal</th><th>Ticker</th><th>Strategy</th><th class="n">Score</th><th class="n">Win %</th><th class="n">Entry</th><th>Status</th></tr></thead><tbody>
    ${recent.map((a) => `<tr><td>${dShort(a.signal_date)}</td><td><span class="t">${esc(a.ticker)}</span></td><td>${esc(a.strategy_label)}</td><td class="n">${esc(a.score)}</td><td class="n">${pct(a.win_pct)}</td><td class="n">${px(a.entry)}</td><td>${statusPill(a.status === "new" ? (a.withdrawn ? "withdrawn" : "expired") : a.status)}${a.withdrawn && a.status === "new" ? `<div class="small muted">${hiCaution(a.withdrawn_reason || "")}</div>` : ""}</td></tr>`).join("")}
    </tbody></table></div></details></section>`;

function statusPill(s) { return `<span class="pill ${{ filled: "good", placed: "info", skipped: "neutral", expired: "neutral", new: "warn", done: "good", withdrawn: "crit" }[s] || "neutral"}">${esc({ filled: "Filled", placed: "Order placed", skipped: "Skipped", expired: "Expired", new: "New", done: "Done", withdrawn: "Withdrawn" }[s] || s)}</span>`; }
function ladderSvg(a) {
  const e = num(a.entry), s = num(a.stop), t = num(a.target); if (e === null || s === null || t === null) return "";
  const H = 116, top = 8, bot = H - 8; const lo = s, hi = t; const Y = (v) => top + (1 - (v - lo) / Math.max(1e-9, hi - lo)) * (bot - top);
  return `<svg class="ladder" viewBox="0 0 34 ${H}" role="img" aria-label="Stop ${px(s)}, entry ${px(e)}, target ${px(t)}">
    <rect x="13" y="${Y(t)}" width="8" height="${Math.max(2, Y(e) - Y(t))}" rx="2" fill="var(--series)"/>
    <rect x="13" y="${Y(e) + 2}" width="8" height="${Math.max(2, Y(s) - Y(e) - 2)}" rx="2" fill="var(--loss)" opacity=".85"/>
    <line x1="6" x2="28" y1="${Y(e)}" y2="${Y(e)}" stroke="var(--ink)" stroke-width="2"/>
  </svg>`;
}
function ticket(a, today) {
  const e = num(a.entry), s = num(a.stop), t = num(a.target);
  const riskPct = e ? (100 * (s - e)) / e : null, rewPct = e ? (100 * (t - e)) / e : null;
  const stale = a.valid_for && a.valid_for < today;
  const grade = a.grade === "A+" ? `<div class="stamp" aria-label="Grade A plus">A+</div>` : `<div class="stamp a">${esc(a.grade || "A")}</div>`;
  const news = a.news_check && a.news_check !== "pending" ? `<div><b>News check:</b> ${hiCaution(a.news_check)}${a.news_note ? " · " + hiCaution(a.news_note) : ""}</div>` : "";
  return `<article class="ticket ${a.capacity_note ? "overcap" : ""}" aria-label="${esc(a.ticker)} setup">
    <div class="t-head">${grade}<div class="t-title"><div class="tk">${esc(a.ticker)}</div><div class="nm" title="${esc(a.name)}">${esc(a.name)}</div>
      <div class="st">${a.rank ? `#${esc(a.rank)} · ` : ""}${esc(a.strategy_label)} · ${esc(a.family)}</div></div>
      <div class="t-odds"><div class="lbl">Win est.</div><div class="big">${pct(a.win_pct, 0)}</div><div class="lbl">Score ${esc(a.score)}</div></div></div>
    <div class="t-body">${ladderSvg(a)}<div class="levels">
      <span class="lk">Target</span><span class="lv">${px(t)}</span><span class="ld">${spct(rewPct)}</span>
      <span class="lk">Buy limit</span><span class="lv">${px(e)}</span><span class="ld">${a.status === "placed" ? statusPill("placed") : `for ${dShort(a.valid_for)}`}</span>
      <span class="lk">Stop</span><span class="lv">${px(s)}</span><span class="ld">${spct(riskPct)}</span>
      <span class="lk">R:R</span><span class="lv" style="font-size:13px">${esc(a.rr)}</span><span class="ld">exp. ${spct(a.exp_return_pct, 2)}</span>
    </div></div>
    <div class="t-facts"><div><div class="k">Size</div><div class="v">${esc(a.shares)} sh${a.fractional ? "*" : ""}</div></div><div><div class="k">Cost</div><div class="v">${money(a.total_cost)}</div></div><div><div class="k">Hold</div><div class="v">≤ ${esc(a.hold_max_days)} d</div></div></div>
    <div class="t-notes">
      <div><b>Order:</b> ${esc(a.order)}</div>
      <div><b>Exit signal:</b> ${esc(a.exit_signal)}</div>
      <div><b>Risk:</b> ${money(a.risk_usd)} (${esc(a.pct_of_capital)}% of capital in the position) · <b>Earnings:</b> ${a.earnings_next ? dShort(a.earnings_next) : "none in the hold window"}</div>
      ${news}
      <div class="small muted">Last checked by the ${dtShort(a._ov_at || a.created_at)} scan</div>
      ${Array.isArray(a.why) && a.why.length ? `<details><summary>Why it qualifies</summary><ul>${a.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>` : ""}
    </div>
    ${a.withdrawn ? `<div class="note-strip" style="background:var(--crit-bg);color:var(--crit)"><b>Withdrawn:</b> ${hiCaution(a.withdrawn_reason || "a later scan dropped this setup.")} If you placed the order, cancel it in your brokerage, then press Skip.</div>` : ""}
    ${a.topup_note ? `<div class="note-strip">${esc(a.topup_note)}</div>` : ""}
    ${a.size_note ? `<div class="note-strip">${esc(a.size_note)}</div>` : ""}
    ${a.capacity_note ? `<div class="note-strip">${esc(a.capacity_note)}</div>` : ""}
    ${stale ? `<div class="note-strip">This order was for ${dShort(a.valid_for)}. If it filled, mark it done; otherwise skip it.</div>` : ""}
    <div class="t-actions">
      <button class="btn primary small" type="button" data-act="fill" data-id="${esc(a.id)}">Mark done (filled)</button>

      <button class="btn ghost small" type="button" data-act="copy" data-id="${esc(a.id)}" title="Copy the order details">Copy</button>
      <button class="btn ghost small" type="button" data-act="skip" data-id="${esc(a.id)}">Skip</button>

}
function actionCard(a) {
  const adjust = a.type === "adjust" && a.code !== "STOP_HIT" && a.new_stop != null;
  const lvl = adjust ? "info" : a.code === "TARGET_HIT" || a.code === "GAP_ABOVE_TARGET" ? "good" : "alert";
  const btns = adjust
    ? `<button class="btn primary small" type="button" data-act="applystop" data-id="${esc(a.id)}">Stop moved</button><button class="btn ghost small" type="button" data-act="dismiss" data-id="${esc(a.id)}">Dismiss</button>`
    : `<button class="btn primary small" type="button" data-act="exitdone" data-id="${esc(a.id)}">Mark done (sold)</button><button class="btn ghost small" type="button" data-act="dismiss" data-id="${esc(a.id)}">Dismiss</button>`;
  const urg = { now: "Now", today: "Before today's close", next: "Next session", open: "At the open" }[a.urgency] || a.urgency || "";
  return `<div class="act ${lvl}"><div class="tk">${esc(a.ticker)}</div><div><div class="what">${esc(a.action)} <span class="pill ${lvl === "alert" ? "crit" : lvl === "good" ? "good" : "info"}">${esc(urg)}</span></div>
    <div class="why">${esc(a.text)}</div><div class="small muted">${dtShort(a.created_at)} · last ${px(a.last)} · P&L ${smoney(a.unrealized)} · day ${esc(a.days_held)}${a.days_left != null ? `, ${esc(Math.max(0, a.days_left))} left` : ""}</div></div>
    <div class="btns">${btns}</div></div>`;
}
function openTable() {
  const open = S.trades.filter((t) => t.status === "open").sort((a, b) => String(a.entry_date).localeCompare(String(b.entry_date)));
  if (!open.length) return `<div class="empty">No open positions. When a limit order fills, press <b>Mark done (filled)</b> on its ticket and enter your actual price; the position then shows here with its stop, target and hold clock.</div>`;
  const marks = latestMarks();
  return `<div class="tbl-wrap"><table><thead><tr><th>Ticker</th><th>Strategy</th><th>Entered</th><th class="n">Entry</th><th class="n">Shares</th><th class="n">Cost</th><th class="n">Stop</th><th class="n">Target</th><th class="n">Last</th><th class="n">Open P&L</th><th class="n">Hold left</th><th>Signals</th><th></th></tr></thead><tbody>
  ${open.map((t) => { const m = marks[t.id] || {}; const held = heldDays(t); const left = (num(t.max_hold) || 7) - held;
    // what the latest scan says to do with this position, and why (the same reason as its alert card)
    const sig = (m.signals || []).map((s) => `<div class="sigline"><span class="pill ${s.level === "alert" ? "crit" : s.level === "good" ? "good" : "info"}">${esc(s.action || s.code.replace(/_/g, " ").toLowerCase())}</span> <span class="small">${hiCaution(s.text || "")}</span></div>`).join("")
      + ((m.signals || []).length && m.scan_at ? `<div class="small muted">from the ${dtShort(m.scan_at)} scan</div>` : "");
    return `<tr><td><span class="t">${esc(t.ticker)}</span></td><td class="small">${esc(t.strategy_label || t.strategy || "Manual")}</td><td>${dShort(t.entry_date)}</td><td class="n">${px(t.entry_price)}</td><td class="n">${esc(t.shares)}</td><td class="n">${money(num(t.entry_price) * num(t.shares))}</td><td class="n">${px(t.stop)}</td><td class="n">${px(t.target)}</td><td class="n">${px(m.last)}</td><td class="n ${signCls(m.unrealized)}">${m.unrealized != null ? `${smoney(m.unrealized)}<br><span class="muted small">${spct(m.unrealized_pct)}</span>` : "–"}</td><td class="n">${left > 0 ? `${left} of ${esc(t.max_hold || 7)} d` : `<span class="pill crit">time stop</span>`}</td><td>${sig || '<span class="muted small">none</span>'}</td>
    <td class="n"><button class="btn small" type="button" data-act="close" data-tid="${esc(t.id)}">Close</button> <button class="btn ghost small" type="button" data-act="edit" data-tid="${esc(t.id)}">Edit</button></td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function activity() {
  const ev = [];
  for (const l of S.ledger) {
    const label = { initial: "Starting balance", deposit: "Funds added", withdrawal: "Funds removed", pnl: "Realized P&L", income: "Income taken from profit" }[l.type] || l.type;
    ev.push({ at: l.created_at || l.date, what: `${label}${l.ticker ? " · " + l.ticker : ""}${l.note ? " · " + l.note : ""}`, amt: l.amount });
  }
  for (const t of S.trades) {
    ev.push({ at: t.opened_at || t.entry_date, what: `Bought ${t.shares} ${t.ticker} @ ${px(t.entry_price)} (${t.strategy_label || t.strategy || "manual"})`, amt: null });
    if (t.status === "closed") ev.push({ at: t.closed_at || t.exit_date, what: `Sold ${t.shares} ${t.ticker} @ ${px(t.exit_price)} · ${t.exit_reason || "exit"}`, amt: null });
  }
  for (const a of S.alerts) if (a.type === "entry" && a.status === "skipped") ev.push({ at: a.skipped_at || a.created_at, what: `Skipped setup ${a.ticker} (${a.strategy_label})`, amt: null });
  ev.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!ev.length) return `<div class="empty">The log starts with your $5,000 starting balance and records every trade, income withdrawal and fund change.</div>`;
  return `<div class="panel timeline" style="padding:0">${ev.slice(0, 250).map((e) => `<div class="ev"><span class="when muted small">${String(e.at || "").length > 10 ? dtShort(e.at) : dShort(e.at)}</span><span>${esc(e.what)}</span><span class="num ${signCls(e.amt)}">${e.amt != null ? smoney(e.amt) : ""}</span></div>`).join("")}</div>`;
}

    ${j.notes ? `<div class="small muted">${esc(j.notes)}</div>` : ""}</article>`;
}

// ---------------------------------------------------------------- modal helpers
function modal(title, body, submitLabel, onSubmit) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-back" id="mb"><form class="modal" id="mf" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}
    <div class="foot"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="submit">${esc(submitLabel)}</button></div></form></div>`;
  const close = () => { root.innerHTML = ""; };
  $("#mCancel").onclick = close;
  $("#mb").addEventListener("click", (e) => { if (e.target.id === "mb") close(); });
  $("#mf").addEventListener("submit", async (e) => { e.preventDefault(); const btn = e.submitter || $("#mf button[type=submit]"); btn.disabled = true;
    try { await onSubmit(); close(); } catch (err) { console.error(err); btn.disabled = false; toast(writeErr(err)); } });
  setTimeout(() => $("#mf input")?.focus(), 30);
}
function writeErr(err) {
  const c = err?.code;
  if (c === "quota_exceeded") return "The dashboard's storage is full. Old scans need pruning; ask Claude to clean up history.";
  if (c === "invalid_argument") return "That change was refused. Check the numbers and try again.";
  if (c === "unavailable") return "Couldn't reach the database just now. Try again in a moment.";
  return "Couldn't save that change. " + (err?.message || "");
}
function need(v, label) { const n = Number(v); if (!Number.isFinite(n) || n <= 0) throw { code: "invalid_argument", message: `${label} must be a positive number.` }; return n; }
async function setDoc(path, data) { if (!S.db) throw { code: "unavailable", message: "Database not connected." }; await S.db.doc(path).set(data); }
async function updDoc(path, data) { if (!S.db) throw { code: "unavailable", message: "Database not connected." }; await S.db.doc(path).update(data); }

// ---------------------------------------------------------------- actions
function alertById(id) { return S.alerts.find((a) => a.id === id); }
function tradeById(id) { return S.trades.find((t) => t.id === id); }
function fillModal(a) {
  modal(`Filled: ${a.ticker}`, `<p class="small muted" style="margin:0">Enter what your brokerage actually filled. A better price than the alert is recorded as-is.</p>
    <div class="form"><div class="row"><label class="f" for="mPx">Actual buy price<input id="mPx" type="number" step="0.01" min="0" value="${esc(a.entry)}" required></label>
    <label class="f" for="mSh">Shares<input id="mSh" type="number" step="0.001" min="0" value="${esc(a.shares)}" required></label>
    <label class="f" for="mDt">Fill date<input id="mDt" type="date" value="${esc(a.valid_for && a.valid_for <= todayPT() ? a.valid_for : todayPT())}" required></label></div>
    <div class="row"><label class="f" for="mSt">Stop<input id="mSt" type="number" step="0.01" min="0" value="${esc(a.stop)}"></label>
    <label class="f" for="mTg">Target<input id="mTg" type="number" step="0.01" min="0" value="${esc(a.target)}"></label>
    <label class="f" for="mHd">Max hold (days)<input id="mHd" type="number" step="1" min="1" value="${esc(a.hold_max_days)}"></label></div></div>`,
    "Save fill", async () => {
      const price = need($("#mPx").value, "Price"), sh = need($("#mSh").value, "Shares");
      const id = "t_" + $("#mDt").value.replace(/-/g, "") + "_" + String(a.ticker).replace(/[^A-Za-z0-9-]/g, "") + "_" + Math.random().toString(36).slice(2, 6);
      await setDoc("trades/" + id, { id, ticker: a.ticker, name: a.name, strategy: a.strategy, strategy_label: a.strategy_label, alert_id: a.id, status: "open",
        entry_price: price, planned_entry: num(a.entry), shares: sh, entry_date: $("#mDt").value, stop: num($("#mSt").value), target: num($("#mTg").value),
        max_hold: Number($("#mHd").value) || a.hold_max_days || 7, dyn_exit: a.dyn_exit || "none", win_pct: num(a.win_pct), score: num(a.score), opened_at: nowIso() });
      await updDoc("alerts/" + a.id, { status: "filled", actual_price: price, actual_shares: sh, done_at: nowIso(), trade_id: id });
      toast(`${a.ticker} logged as filled. Set the stop ${px($("#mSt").value)} and target ${px($("#mTg").value)} in your brokerage.`);
    });
}
function closeModal(t, pre = {}) {
  const st = settings(); const m = latestMarks()[t.id] || {};
  const defPx = pre.price ?? m.last ?? t.target;
  modal(`Close ${t.ticker}`, `<p class="small muted" style="margin:0">Entered ${dShort(t.entry_date)} at ${px(t.entry_price)} × ${esc(t.shares)} shares.</p>
    <div class="form"><div class="row"><label class="f" for="cPx">Actual sell price<input id="cPx" type="number" step="0.01" min="0" value="${esc(defPx != null ? Number(defPx).toFixed(2) : "")}" required></label>
    <label class="f" for="cDt">Sell date<input id="cDt" type="date" value="${todayPT()}" required></label>
    <label class="f" for="cWhy">Reason<select id="cWhy">${["Target filled", "Stop filled", "Exit signal (sold at close)", "Time stop", "Before earnings", "Trend break", "Manual"].map((r) => `<option ${r === pre.reason ? "selected" : ""}>${r}</option>`).join("")}</select></label></div>
    <label class="f" for="cInc">Income to take if profitable (% of profit)<input id="cInc" type="number" min="0" max="100" step="1" value="${esc(st.income_default_pct)}"></label>
    <div class="small muted" id="cPrev"></div></div>`, "Close trade", async () => {
      const ex = need($("#cPx").value, "Sell price"); const d = $("#cDt").value; const incPct = Math.min(100, Math.max(0, Number($("#cInc").value) || 0));
      await closeTrade(t, ex, d, $("#cWhy").value, incPct, pre.alertId);
    });
  const prev = () => { const ex = Number($("#cPx").value); if (!ex) return; const pnl = (ex - num(t.entry_price)) * num(t.shares); $("#cPrev").textContent = `P&L ${smoney(pnl)} (${spct((100 * (ex - t.entry_price)) / t.entry_price, 2)})` + (pnl > 0 ? ` · income ${money((pnl * (Number($("#cInc").value) || 0)) / 100)}` : ""); };
  $("#cPx").addEventListener("input", prev); $("#cInc").addEventListener("input", prev); prev();
}
async function closeTrade(t, ex, date, reason, incPct, alertId) {
  const entry = num(t.entry_price), sh = num(t.shares);
  const pnl = +((ex - entry) * sh).toFixed(2); const pnlPct = +((100 * (ex - entry)) / entry).toFixed(3);
  const risk = num(t.stop) && entry > num(t.stop) ? (entry - num(t.stop)) : null;
  const held = tradingDaysBetween(t.entry_date, date) + (isTradingDay(t.entry_date) ? 1 : 0);
  const income = pnl > 0 ? +((pnl * incPct) / 100).toFixed(2) : 0;
  await updDoc("trades/" + t.id, { status: "closed", exit_price: ex, exit_date: date, exit_reason: reason, pnl, pnl_pct: pnlPct, r_mult: risk ? +((ex - entry) / risk).toFixed(2) : null,
    days_held: held, income_pct: pnl > 0 ? incPct : 0, income_amount: income, closed_at: nowIso() });
  await setDoc("ledger/pnl_" + t.id, { id: "pnl_" + t.id, type: "pnl", amount: pnl, date, ticker: t.ticker, trade_id: t.id, created_at: nowIso() });
  if (income > 0) await setDoc("ledger/inc_" + t.id, { id: "inc_" + t.id, type: "income", amount: -income, date, ticker: t.ticker, trade_id: t.id, pct: incPct, created_at: nowIso() });
  else if (S.ledger.some((l) => l.id === "inc_" + t.id)) await S.db.doc("ledger/inc_" + t.id).delete();
  const open = S.alerts.filter((a) => a.trade_id === t.id && a.status === "new" && a.type !== "entry");
  for (const a of open) await updDoc("alerts/" + a.id, { status: a.id === alertId ? "done" : "dismissed", done_at: nowIso() });
  toast(`${t.ticker} closed: ${smoney(pnl)}${income ? `, ${money(income)} set aside as income` : ""}.`);
}
function editModal(t) {
  const closed = t.status === "closed";
  modal(`Edit ${t.ticker}`, `<div class="form"><div class="row">
    <label class="f" for="ePx">Entry price<input id="ePx" type="number" step="0.01" value="${esc(t.entry_price)}"></label>
    <label class="f" for="eSh">Shares<input id="eSh" type="number" step="0.001" value="${esc(t.shares)}"></label>
    <label class="f" for="eDt">Entry date<input id="eDt" type="date" value="${esc(t.entry_date)}"></label></div>
    <div class="row"><label class="f" for="eSt">Stop<input id="eSt" type="number" step="0.01" value="${esc(t.stop ?? "")}"></label>
    <label class="f" for="eTg">Target<input id="eTg" type="number" step="0.01" value="${esc(t.target ?? "")}"></label>
    <label class="f" for="eHd">Max hold (days)<input id="eHd" type="number" step="1" value="${esc(t.max_hold ?? 7)}"></label></div>
    ${closed ? `<div class="row"><label class="f" for="eEx">Exit price<input id="eEx" type="number" step="0.01" value="${esc(t.exit_price)}"></label><label class="f" for="eEd">Exit date<input id="eEd" type="date" value="${esc(t.exit_date)}"></label></div>` : ""}
    <label class="f" for="eDel"><span><input id="eDel" type="checkbox"> Delete this trade (removes its P&L and income entries)</span></label></div>`, "Save", async () => {
      if ($("#eDel").checked) {
        await S.db.doc("trades/" + t.id).delete();
        for (const p of ["pnl_", "inc_"]) if (S.ledger.some((l) => l.id === p + t.id)) await S.db.doc("ledger/" + p + t.id).delete();
        if (t.alert_id && alertById(t.alert_id)) await updDoc("alerts/" + t.alert_id, { status: "new", trade_id: null });
        toast(`${t.ticker} trade deleted.`); return;
      }
      const upd = { entry_price: need($("#ePx").value, "Entry"), shares: need($("#eSh").value, "Shares"), entry_date: $("#eDt").value,
        stop: num($("#eSt").value), target: num($("#eTg").value), max_hold: Number($("#eHd").value) || 7 };
      await updDoc("trades/" + t.id, upd);
      if (closed) { const t2 = { ...t, ...upd }; const st = settings(); await closeTrade(t2, need($("#eEx").value, "Exit"), $("#eEd").value, t.exit_reason || "Manual", num(t.income_pct) ?? Number(st.income_default_pct)); }
      else toast(`${t.ticker} updated.`);
    });
}
async function applyIncome(t) {
  const p = Math.min(100, Math.max(0, Number($("#inc-" + CSS.escape(t.id)).value) || 0));
  const income = num(t.pnl) > 0 ? +((num(t.pnl) * p) / 100).toFixed(2) : 0;
  await updDoc("trades/" + t.id, { income_pct: p, income_amount: income });
  if (income > 0) await setDoc("ledger/inc_" + t.id, { id: "inc_" + t.id, type: "income", amount: -income, date: t.exit_date, ticker: t.ticker, trade_id: t.id, pct: p, created_at: nowIso() });
  else if (S.ledger.some((l) => l.id === "inc_" + t.id)) await S.db.doc("ledger/inc_" + t.id).delete();
  toast(`${t.ticker}: income set to ${p}% (${money(income)}).`);
}
async function copyOrder(a) {
  const txt = `${a.ticker} BUY LIMIT ${px(a.entry)} x ${a.shares} sh (day order ${a.valid_for})\nSTOP ${px(a.stop)}  TARGET (limit sell) ${px(a.target)}\nHold up to ${a.hold_max_days} trading days. ${a.exit_signal}`;
  try { await navigator.clipboard.writeText(txt); toast("Order copied."); }
  catch { modal(`Order for ${a.ticker}`, `<textarea id="cpy" rows="6" readonly>${esc(txt)}</textarea>`, "Done", async () => {}); setTimeout(() => { const el = $("#cpy"); el?.focus(); el?.select(); }, 40); }
}
function fireErr(e) {
  const c = e?.code;
  return { needs_reauth: "Reconnect Claude Code Remote in claude.ai Settings → Connectors, then try again.",
    server_not_connected: "The scan service isn't available in this view. Open the dashboard in claude.ai to run a scan.",
    not_in_manifest: "This page isn't allowed to start scans for you. Allow it in the artifact's permissions, then try again.",
    approval_required: "Starting a scan needs your approval. Press the button again and allow it when asked.",
    tool_error: "The scan service refused the request: " + (e?.message || "unknown reason") + ".",
    server_unavailable: "The scan service didn't answer. It is tried again automatically in a minute." }[c] || "Couldn't start the scan (" + (c || "error") + "). Try again shortly.";
}
async function scanNow(opts = {}) {
  const st = settings();
  if (!S.mcp || !st.manual_trigger_id || !S.db || S.starting) return;
  const cur = currentRun();
  if (cur && cur.active) { toast("A scan is already running. Its progress is shown under the tabs."); return; }
  const token = "rt_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const retryOf = opts.retryOf || null;
  S.starting = token; runDismissed = null; renderChips();
  try {
    await S.db.doc("runs/" + token + "-s0").set({ token, seq: 0, state: "requested", pct: 4, step: retryOf ? "Starting the scan again" : "Starting the scan session", at: nowIso(), by: "page", kind: "manual", ...(retryOf ? { retry_of: retryOf } : {}) });
  } catch (e) { S.starting = null; renderChips(); toast(writeErr(e)); return; }
  noteMyRun(token, retryOf);
  try {
    await S.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: st.manual_trigger_id,
      text: `Run token: ${token}\n` + (retryOf ? `This is a retry: the scan started with run token ${retryOf} stopped before finishing, so finish this one end to end. ` : "") +
        `Manual scan requested from the dashboard at ${new Date().toISOString()}. Report progress with this token as the task describes.` });
    toast(retryOf ? "Scan started again. Follow its progress under the tabs." : "Scan started. Follow its progress under the tabs; alerts are also emailed to you.", 6000);
  } catch (e) {
    const c = e?.code, msg = fireErr(e);
    try { await S.db.doc("runs/" + token + "-s9").set({ token, seq: 9, state: "failed", step: "Couldn't start", message: msg, code: c || "error", at: nowIso(), by: "page" }); } catch {}
    toast(msg, 8000);
  } finally { S.starting = null; renderChips(); }
  // tidy up: progress records older than two days (this press is the user action that allows it)
  const cutoff = Date.now() - 2 * 86400000;
  for (const r of S.runs.filter((x) => (Date.parse(x.at) || 0) < cutoff).slice(0, 25)) { try { await S.db.doc("runs/" + r.id).delete(); } catch { break; } }
}

// a scheduled run that failed twice today (run + backup check): start it again from the Today's runs panel
async function runNow(key) {
  if (key !== "learning" && key !== "weekly") return scanNow();  // Scan now picks the right scan for the time of day
  const id = settings().schedule_ids?.[key];
  if (!S.mcp || !id) { toast("Open the dashboard in claude.ai to start it from here."); return; }
  try {
    await S.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: id,
      text: `Started from the dashboard's Today's runs panel at ${new Date().toISOString()}: today's run and its backup check didn't save results.` });
    toast(`${key === "weekly" ? "Weekly recalibration" : "Daily learning review"} started; it takes ${key === "weekly" ? "about an hour" : "30 to 50 minutes"}.`, 7000);
  } catch (e) { toast(fireErr(e), 8000); }
}

// ---------------------------------------------------------------- events
document.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; try { localStorage.setItem("tab", S.tab); } catch {} render(); window.scrollTo(0, 0); return; }
  const pf = e.target.closest("[data-perf]"); if (pf) { S.perf = pf.dataset.perf; render(); return; }
  const lf = e.target.closest("[data-logf]"); if (lf) { S.logFilter = lf.dataset.logf; render(); return; }
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act; const a = btn.dataset.id ? alertById(btn.dataset.id) : null; const t = btn.dataset.tid ? tradeById(btn.dataset.tid) : null;
  try {
    if (act === "fill" && a) fillModal(a);
    else if (act === "placed" && a) { await updDoc("alerts/" + a.id, { status: "placed", placed_at: nowIso() }); toast(`${a.ticker} marked as placed.`); }
    else if (act === "skip" && a) { await updDoc("alerts/" + a.id, { status: "skipped", skipped_at: nowIso() }); toast(`${a.ticker} skipped. The learning loop still grades it.`); }
    else if (act === "copy" && a) copyOrder(a);
    else if (act === "dismiss" && a) { await updDoc("alerts/" + a.id, { status: "dismissed", done_at: nowIso() }); }
    else if (act === "applystop" && a) { const tr = tradeById(a.trade_id); if (tr && a.new_stop) await updDoc("trades/" + tr.id, { stop: num(a.new_stop) }); await updDoc("alerts/" + a.id, { status: "done", done_at: nowIso() }); toast(`${a.ticker} stop updated to ${px(a.new_stop)}.`); }
    else if (act === "exitdone" && a) { const tr = tradeById(a.trade_id); if (tr) closeModal(tr, { price: a.code === "TARGET_HIT" ? tr.target : a.code === "STOP_HIT" ? tr.stop : a.last, alertId: a.id,
      reason: { TARGET_HIT: "Target filled", GAP_ABOVE_TARGET: "Target filled", STOP_HIT: "Stop filled", GAP_BELOW_STOP: "Stop filled", EXIT_RULE: "Exit signal (sold at close)", TIME_STOP: "Time stop", EARNINGS: "Before earnings", TREND_BREAK: "Trend break" }[a.code] || "Manual" }); }
    else if (act === "close" && t) closeModal(t);
    else if (act === "edit" && t) editModal(t);
    else if (act === "income" && t) await applyIncome(t);
    else if (act === "runnow") await runNow(btn.dataset.run);
  } catch (err) { console.error(err); toast(writeErr(err)); }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id === "fundsForm") { e.preventDefault();
    try { const amt = need($("#fAmt").value, "Amount"); const typ = $("#fType").value; const id = (typ === "deposit" ? "dep_" : "wd_") + Date.now().toString(36);
      await setDoc("ledger/" + id, { id, type: typ, amount: typ === "deposit" ? amt : -amt, date: $("#fDate").value || todayPT(), note: $("#fNote").value.slice(0, 120), created_at: nowIso() });
      toast(`${typ === "deposit" ? "Added" : "Removed"} ${money(amt)}.`); } catch (err) { toast(writeErr(err)); } }
  if (e.target.id === "setForm") { e.preventDefault();
    try { const s = { ...settings(), initial_balance: need($("#sInit").value, "Starting balance"), income_default_pct: Math.min(100, Math.max(0, Number($("#sInc").value) || 0)),
        max_open_positions: Math.max(1, Math.round(Number($("#sMax").value) || 5)), risk_pct: need($("#sRisk").value, "Risk per trade"), max_position_pct: need($("#sPos").value, "Max position"), updated_at: nowIso() };
      await setDoc("config/settings", s);
      const init = S.ledger.find((l) => l.type === "initial");
      if (init && num(init.amount) !== s.initial_balance) await updDoc("ledger/" + init.id, { amount: s.initial_balance });
      toast("Settings saved. The next scan uses them."); } catch (err) { toast(writeErr(err)); } }
});
$("#scanBtn").addEventListener("click", () => scanNow());

// ---------------------------------------------------------------- boot
try { const t = localStorage.getItem("tab"); if (t && TABS.some(([k]) => k === t)) S.tab = t; } catch {}
render();
const loadTimer = setTimeout(() => { if (!S.loaded.alerts) { S.dbError = "The dashboard database hasn't answered yet. Data may be out of date; it refreshes automatically."; render(); } }, 10000);
// live updates re-render the page, but never while you are typing in one of its forms
let rq = 0, pending = false;
const typing = () => { const el = document.activeElement; return el && $("#main").contains(el) && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName); };
const rerender = () => { if (typing()) { pending = true; return; } cancelAnimationFrame(rq); rq = requestAnimationFrame(render); };
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing()) { pending = false; render(); } }, 0));
(async () => {
  const [db, user, mcp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("mcp")]);
  S.db = db; S.user = user; S.mcp = mcp;
  if (!db) { clearTimeout(loadTimer); S.dbError = "This view can't reach the dashboard database. Open the dashboard in claude.ai while signed in."; render(); return; }
  const onErr = (name) => (err) => { console.error(name, err); if (err?.code !== "unavailable") { S.dbError = `Couldn't load ${name} (${err?.code}).`; rerender(); } };
  const list = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  db.doc("config/settings").onSnapshot((d) => { S.settings = d.exists ? d.data() : null; S.loaded.settings = true; rerender(); }, onErr("settings"));
  db.collection("alerts").orderBy("created_at", "desc").limit(400).onSnapshot((s) => { S.alertsRaw = list(s); mergeAlerts(); S.loaded.alerts = true; if (!s.metadata.fromCache) { clearTimeout(loadTimer); S.dbError = null; } rerender(); }, onErr("alerts"));
  db.collection("trades").onSnapshot((s) => { S.trades = list(s); S.loaded.trades = true; rerender(); }, onErr("trades"));
  db.collection("ledger").onSnapshot((s) => { S.ledger = list(s); S.loaded.ledger = true; rerender(); }, onErr("ledger"));
  db.collection("scans").orderBy("started_at", "desc").limit(60).onSnapshot((s) => { S.scans = list(s).sort((a, b) => (Date.parse(b.started_at) || 0) - (Date.parse(a.started_at) || 0)).slice(0, 40); mergeAlerts(); rerender(); }, onErr("scans"));
  db.collection("runs").orderBy("at", "desc").limit(60).onSnapshot((s) => { S.runs = list(s); noteRuns(); renderRunbar(); renderChips(); maybeAutoRetry(); }, onErr("scan progress"));
  setInterval(() => { maybeAutoRetry(); renderRunbar(); renderChips(); }, 30000);
  let healthSig = "";  // re-render when a run's status changes with the clock (due → running → late → backup)
  setInterval(() => { const sig = runHealth().items.map((i) => i.state).join(","); if (sig !== healthSig) { healthSig = sig; rerender(); } }, 60000);
  db.collection("research").limit(400).onSnapshot((s) => { S.research = list(s); rerender(); }, onErr("research"));
  db.collection("learning").limit(20).onSnapshot((s) => { S.learning = Object.fromEntries(list(s).map((d) => [d.id, d])); rerender(); }, onErr("learning record"));
  db.collection("research_results").orderBy("tested_at", "desc").limit(400).onSnapshot((s) => { S.results = list(s); rerender(); }, onErr("research results"));
  db.collection("journal").orderBy("date", "desc").limit(60).onSnapshot((s) => { S.journal = list(s); rerender(); }, onErr("journal"));
  db.doc("strategy/params").onSnapshot((d) => { S.params = d.exists ? d.data() : null; rerender(); }, onErr("strategy params"));
  db.doc("strategy/backtest").onSnapshot((d) => { S.backtest = d.exists ? d.data() : null; rerender(); }, onErr("backtest"));
})();
})();
</script>
