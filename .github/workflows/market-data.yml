name: market-data

# Refreshes the `data` branch the Swing Desk scans read from.
# Times are UTC; the script works out pre-market / intraday / post-close itself,
# so both daylight-saving regimes are covered.
on:
  schedule:
    # GitHub runs scheduled workflows late or skips some at busy times: about one run an hour gets through,
    # however often it is asked. So these only start the day: on a trading day a run that starts between
    # 6:30 AM ET and 40 minutes after the close keeps going and refreshes every 10 minutes itself
    # (pipeline/refresh_loop.sh), handing over to a new run before GitHub's 6-hour job limit.
    - cron: "4,19,34,49 11-23 * * 1-5"   # ~3-4 AM to 3-4 PM Pacific, weekdays (both DST regimes)
    - cron: "17 13 * * 6"                # Saturday history rebuild for the weekly recalibration (+ keepalive)
    - cron: "41 1 * * 2-6"               # late-evening safety pass (catches a missed post-close run)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | daily | intraday | premarket | earnings | history | all"
        default: "auto"
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/market-data.yml"]

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # the refresh loop starts its own next run (pipeline/refresh_loop.sh)

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the market-day refresh loop runs up to 5.5 hours, then hands over
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Restore current data branch
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git archive refs/remotes/origin/data | tar -x -C out
          fi
          ls -la out

      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        if: github.event.schedule == '17 13 * * 6'
        run: |
          last=$(git log -1 --format=%ct HEAD)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit on main: $days days ago"
          if [ "$days" -ge 40 ]; then
            git config user.name "swing-desk-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive: keep the market-data schedule active"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi

      - name: Fetch and publish (every 10 minutes through a market day)
        env:
          MODE: ${{ github.event_name == 'push' && 'all' || github.event.inputs.mode || (github.event.schedule == '17 13 * * 6' && 'history') || 'auto' }}
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash pipeline/refresh_loop.sh
